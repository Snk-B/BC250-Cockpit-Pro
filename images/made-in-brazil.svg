<svg xmlns="http://www.w3.org/2000/svg" width="140" height="20" viewBox="0 0 140 20" role="img" aria-label="Made in Brazil">
  <title>Made in Brazil</title>
  <linearGradient id="shine" x2="0" y2="100%">
    <stop offset="0" stop-color="#fff" stop-opacity=".15"/>
    <stop offset="100%" stop-color="#000" stop-opacity=".15"/>
  </linearGradient>
  <clipPath id="round">
    <rect width="140" height="20" rx="4"/>
  </clipPath>
  <g clip-path="url(#round)">
    <rect width="140" height="20" fill="#009b3a"/>
    <rect width="140" height="20" fill="url(#shine)"/>
  </g>
  <!-- Brazilian Flag Miniature -->
  <g transform="translate(6, 4)">
    <rect width="18" height="12" rx="1.5" fill="#009b3a" stroke="rgba(255,255,255,0.2)" stroke-width="0.5"/>
    <polygon points="9,1 17,6 9,11 1,6" fill="#fedf01"/>
    <circle cx="9" cy="6" r="3.2" fill="#002776"/>
    <path d="M 6.2 6.5 Q 9 5.2 11.8 6.5" fill="none" stroke="#ffffff" stroke-width="0.7"/>
  </g>
  <text x="30" y="14" fill="#ffffff" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Verdana,sans-serif" font-size="11" font-weight="700" letter-spacing="0.3">Made in Brazil</text>
</svg>
