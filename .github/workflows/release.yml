name: Release static binary

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create/update (used only for manual runs)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run verification tests
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_memory.py' -v
          node tests/test_v2_memory.js
          bash tests/test_install_lib.sh
          bash -n install.sh install-lib.sh uninstall.sh

      - name: Build apu_telemetry
        run: |
          if g++ -std=c++20 -Wall -Wextra -O3 -static -o apu_telemetry bc250_telemetry.cpp; then
            echo "Static build succeeded." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ Full static link unavailable, using static libstdc++/libgcc fallback." >> "$GITHUB_STEP_SUMMARY"
            g++ -std=c++20 -Wall -Wextra -O3 -static-libstdc++ -static-libgcc -o apu_telemetry bc250_telemetry.cpp
          fi

      - name: Verify binary
        run: |
          file apu_telemetry
          ldd apu_telemetry || true

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package ready-to-run bundle
        run: |
          BUNDLE=BC250-Cockpit-Pro
          mkdir -p "dist/$BUNDLE"
          cp apu_telemetry bc250_telemetry.cpp daemon_log.h memory_telemetry.h sysfs_util.h telemetry_config.h vrm_backend.h install.sh install-lib.sh uninstall.sh apu-telemetry.service README.md LICENSE hardware.md "dist/$BUNDLE/"
          cp -r web images memory mangohud plasma "dist/$BUNDLE/"
          chmod +x "dist/$BUNDLE/apu_telemetry" "dist/$BUNDLE/install.sh" "dist/$BUNDLE/uninstall.sh"
          tar -C dist -czf BC250-Cockpit-Pro.tar.gz "$BUNDLE"
          cp BC250-Cockpit-Pro.tar.gz bc250-telemetry.tar.gz

      - name: Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            BC250-Cockpit-Pro.tar.gz
            bc250-telemetry.tar.gz

      - name: Upload workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BC250-Cockpit-Pro
          path: BC250-Cockpit-Pro.tar.gz
